# =============================================
# Entorno local con dos motores, selecionado por perfil.
#
#   docker compose --profile mysql up        # MySQL
#   docker compose --profile postgres up     # PostgreSQL, el mismo dialeto que usa Supabase en produccion
#
# No existe un `docker compose up` a secas: los dos pares motor+api estan perfilados.
# Es deliberado. Con un unico `api` sin perfil, `depends_on: mysql` harian que el
# archivo entero se rechazara con "depends on undefined service 'mysql'".
#
# Los secretos (DB_PASSWORD, JWT_SECRET, BREVO_API_KEY, BREVO_FROM_ADDRESS) se pasan
# a traves de un archivo .env en la raiz. Copie compose.env.example como .env y
# reemplace los valores. Compose fallara si falta algun secreto marcado con ':?'.
# Los puertos de MySQL, PostgreSQL y la API se publican solo en 127.0.0.1.
# =============================================

x-api-base: &api-base
  build:
    context: .
    dockerfile: Dockerfile
  image: users-management-api:local
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-brevo: &brevo
  BREVO_API_KEY: ${BREVO_API_KEY:?Defina BREVO_API_KEY en el archivo .env local}
  BREVO_FROM_ADDRESS: ${BREVO_FROM_ADDRESS:?Defina BREVO_FROM_ADDRESS en el archivo .env local}
  BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Gestion de Usuarios}

x-jwt: &jwt
  JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env local}
  JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}

services:

  # ---------------------------------------------------------------
  # MySQL
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: crud_usuarios
      MYSQL_USER: users_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en el archivo .env local}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    <<: *api-base
    profiles: ["mysql"]
    environment:
      PORT: "8080"
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: crud_usuarios
      DB_USERNAME: users_app
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env local}
      DB_SSL_MODE: DISABLED
      <<: [*brevo, *jwt]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  # ---------------------------------------------------------------
  # PostgreSQL
  # PostgreSQL local, para probar el mismo dialeto que usa Supabase en produccion.
  # ---------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: crud_usuarios
      POSTGRES_USER: users_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_app -d crud_usuarios"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api-postgres:
    <<: *api-base
    profiles: ["postgres"]
    environment:
      PORT: "8080"
      DB_DIALECT: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: crud_usuarios
      DB_USERNAME: users_app
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env local}
      DB_SSL_MODE: DISABLED
      <<: [*brevo, *jwt]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mysql-data:
  postgres-data:
